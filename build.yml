name: Build FpsMeter
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Organizar arquivos (versao celular)
        run: |
          if [ ! -d src ]; then
            mkdir -p src/main/java/com/fpsmeter src/main/resources
            mv *.java src/main/java/com/fpsmeter/
            mv mcmod.info src/main/resources/
          fi
      - name: Instalar Gradle 4.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle-4.9-bin.zip
      - name: Compilar
        run: ./gradle-4.9/bin/gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FpsMeter-mod
          path: build/libs/FpsMeter-1.0.0.jar
